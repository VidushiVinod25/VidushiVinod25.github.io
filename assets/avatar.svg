<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow & Shapes -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGrad)" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="200" r="165" fill="#18181b" stroke="url(#bgGrad)" stroke-width="4" stroke-dasharray="10 6" />

  <!-- Abstract Code / Tech Floating Icons -->
  <g opacity="0.8">
    <rect x="50" y="90" width="45" height="45" rx="10" fill="#6366f1" opacity="0.25" />
    <text x="72" y="120" font-family="monospace" font-size="20" fill="#818cf8" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>

    <rect x="310" y="110" width="40" height="40" rx="10" fill="#ec4899" opacity="0.25" />
    <text x="330" y="136" font-family="monospace" font-size="22" fill="#f472b6" font-weight="bold" text-anchor="middle">{ }</text>

    <rect x="60" y="270" width="40" height="40" rx="10" fill="#10b981" opacity="0.25" />
    <text x="80" y="297" font-family="monospace" font-size="20" fill="#34d399" font-weight="bold" text-anchor="middle">#_</text>

    <rect x="305" y="260" width="45" height="45" rx="10" fill="#f59e0b" opacity="0.25" />
    <text x="327" y="290" font-family="sans-serif" font-size="22" fill="#fbbf24" font-weight="bold" text-anchor="middle">⚡</text>
  </g>

  <!-- Developer Silhouette / Character -->
  <!-- Shoulders / Torso -->
  <path d="M 120 360 C 120 290, 280 290, 280 360 Z" fill="#6366f1" />
  <path d="M 150 360 C 150 315, 250 315, 250 360 Z" fill="#4338ca" />
  
  <!-- Neck -->
  <rect x="182" y="240" width="36" height="45" rx="8" fill="#f59e0b" />
  
  <!-- Head & Hair Back -->
  <ellipse cx="200" cy="180" rx="60" ry="70" fill="url(#hairGrad)" />
  
  <!-- Face -->
  <ellipse cx="200" cy="190" rx="48" ry="52" fill="#fed7aa" />

  <!-- Hair Front / Style -->
  <path d="M 150 180 C 150 130, 250 130, 250 180 C 235 155, 215 150, 200 160 C 185 150, 165 155, 150 180 Z" fill="url(#hairGrad)" />
  <path d="M 152 175 Q 160 220 162 250 Q 150 240 148 200 Z" fill="url(#hairGrad)" />
  <path d="M 248 175 Q 240 220 238 250 Q 250 240 252 200 Z" fill="url(#hairGrad)" />

  <!-- Glasses -->
  <rect x="165" y="180" width="28" height="20" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
  <rect x="207" y="180" width="28" height="20" rx="6" fill="none" stroke="#6366f1" stroke-width="3" />
  <line x1="193" y1="190" x2="207" y2="190" stroke="#6366f1" stroke-width="3" />

  <!-- Eyes -->
  <circle cx="179" cy="190" r="3.5" fill="#1e1b4b" />
  <circle cx="221" cy="190" r="3.5" fill="#1e1b4b" />
  <circle cx="180" cy="189" r="1" fill="#ffffff" />
  <circle cx="222" cy="189" r="1" fill="#ffffff" />

  <!-- Smile -->
  <path d="M 188 218 Q 200 228 212 218" fill="none" stroke="#ea580c" stroke-width="2.5" stroke-linecap="round" />

  <!-- Laptop / Desk outline in foreground -->
  <path d="M 130 355 L 270 355 L 260 365 L 140 365 Z" fill="#94a3b8" />
  <rect x="155" y="325" width="90" height="30" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />
  <polygon points="195,335 205,340 195,345" fill="#a855f7" />
</svg>
